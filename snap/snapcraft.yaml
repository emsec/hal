name: hal
title: HAL - Hardware Analyzer
summary: Gate-level netlist reverse engineering and manipulation framework
description: |
  HAL is a comprehensive reverse engineering and manipulation framework for
  gate-level netlists, with a Qt GUI, Python scripting, and a plugin system.
license: MIT
# HAL's own window icon (the GUI loads it as :/icons/hal); snapcraft copies it to meta/gui/icon.svg.
icon: plugins/gui/resources/icons/HAL9000.svg
adopt-info: hal
base: core24
# First iteration: devmode skips confinement so we can test packaging in isolation.
# Switch to "strict" once the app runs, then fix whatever the plugs below miss.
confinement: devmode
grade: devel
platforms:
  amd64:
  arm64:

apps:
  hal:
    command: usr/bin/hal
    # Desktop launcher: snap/gui/hal.desktop (runs `hal -g`); icon from the top-level icon key.
    environment:
      # HAL derives its base path from the binary location, but be explicit.
      HAL_BASE_PATH: $SNAP/usr
      LD_LIBRARY_PATH: $SNAP/usr/lib:$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/blas:$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/lapack
      QT_PLUGIN_PATH: $SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/qt6/plugins
      PYTHONHOME: $SNAP/usr
      PYTHONPATH: $SNAP/usr/lib/python3.12:$SNAP/usr/lib/python3.12/lib-dynload:$SNAP/usr/lib/python3/dist-packages
      # Graphviz (dot_viewer) looks for its plugins under the host's /usr/lib by default.
      GVBINDIR: $SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/graphviz
      # Verilator simulation runs verilator, make and g++ as child processes; use the
      # bundled ones (toolchain part). The wrappers in toolchain/bin must come first.
      PATH: $SNAP/toolchain/bin:$PATH
      VERILATOR_ROOT: $SNAP/usr/share/verilator
      PERL5LIB: $SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/perl5/5.38:$SNAP/usr/share/perl5:$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/perl-base:$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/perl/5.38:$SNAP/usr/share/perl/5.38
    plugs:
      - home
      - removable-media
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - network

parts:
  hal:
    plugin: cmake
    source: .
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      # Plain lib/ on every architecture: HAL's runtime lookup (src/utilities/utils.cpp)
      # only knows lib/x86_64-linux-gnu, lib64 and lib, so aarch64-linux-gnu would be missed.
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_ALL_PLUGINS=ON
      - -DPL_GUI=ON
      - -DBUILD_TESTS=OFF
      - -DBUILD_DOCUMENTATION=OFF
      - -DPACKAGE_DEB=OFF
      # ldconfig cannot run inside the snap build; libraries are found via LD_LIBRARY_PATH.
      - -DENABLE_INSTALL_LDCONFIG=OFF
    override-pull: |
      craftctl default
      craftctl set version="$(git describe --tags --always | sed 's/^v//')"
    override-build: |
      craftctl default
      # Ship the sample netlists with the snap only; CMake does not install them.
      # The glob skips dotfiles such as .gitignore and .DS_Store.
      install -d "$CRAFT_PART_INSTALL/usr/share/hal/examples"
      cp -r "$CRAFT_PART_SRC"/examples/* "$CRAFT_PART_INSTALL/usr/share/hal/examples/"
    override-prime: |
      craftctl default
      # Graphviz only loads plugins listed in config6a, which libgvc6's postinst normally
      # creates with `dot -c`. Stage packages skip postinst, so generate it here.
      # Runs the staged arm64/amd64 dot binary, so this needs a native (not cross) build.
      GV="$CRAFT_PRIME/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/graphviz"
      GVBINDIR="$GV" \
      LD_LIBRARY_PATH="$CRAFT_PRIME/usr/lib:$CRAFT_PRIME/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}" \
        "$CRAFT_PRIME/usr/bin/dot" -c
      test -s "$GV/config6a"
    build-packages:
      # Mirrors install_dependencies.sh for Ubuntu 24.04, minus docs/coverage tooling.
      - build-essential
      - git
      - pkgconf
      - autoconf
      - autotools-dev
      - libboost-all-dev
      - qt6-base-dev
      - qt6-5compat-dev
      - libqt6svg6-dev
      - libpython3-dev
      - python3-pybind11
      - pybind11-dev
      - rapidjson-dev
      - libspdlog-dev
      - libz3-dev
      - libsodium-dev
      - libreadline-dev
      - libgraphviz-dev
      - libxcb-xkb-dev
      - libomp-dev
      - libsuitesparse-dev
    stage-packages:
      - libqt6core6t64
      - libqt6gui6t64
      - libqt6widgets6t64
      - libqt6concurrent6t64
      - libqt6svg6
      - libqt6core5compat6
      - qt6-qpa-plugins
      - qt6-wayland
      - qt6-gtk-platformtheme
      - libpython3.12t64
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - python3.12
      - python3-jedi
      - python3-dateutil
      - libz3-4
      - z3
      - libsodium23
      - libreadline8t64
      - libgvc6
      - libcgraph6
      - libomp5-18
      - libboost-filesystem1.83.0
      - libboost-program-options1.83.0
      - libspdlog1.12
      - libsuitesparse-dev
      - libgomp1
      - graphviz
      - fonts-dejavu-core

  # Toolchain for the Verilator simulation backend (plugins/simulator/verilator), which
  # generates C++ from the design and compiles it with make + g++ at runtime.
  # Inside the snap the host's /usr is not visible, so everything is bundled here.
  toolchain:
    # After hal so that override-prime below sees the complete prime directory.
    after: [hal]
    plugin: nil
    stage-packages:
      - verilator
      - make
      - perl
      - binutils
      - gcc-13
      - g++-13
      - libc6-dev
      - libstdc++-13-dev
      - libgcc-13-dev
      - rapidjson-dev
      - zlib1g-dev
    override-build: |
      craftctl default
      # Wrappers that run the bundled tools from $SNAP:
      # - g++/gcc compile against $SNAP as sysroot, so headers and dev libraries come
      #   from the snap instead of the (header-less) base snap.
      # - verilator is a perl script whose #! points at /usr/bin/perl, absent in core24.
      B="$CRAFT_PART_INSTALL/toolchain/bin"
      install -d "$B"
      for c in g++ c++; do
        printf '#!/bin/sh\nexec "$SNAP/usr/bin/g++-13" --sysroot="$SNAP" "$@"\n' > "$B/$c"
      done
      for c in gcc cc; do
        printf '#!/bin/sh\nexec "$SNAP/usr/bin/gcc-13" --sysroot="$SNAP" "$@"\n' > "$B/$c"
      done
      printf '#!/bin/sh\nexec "$SNAP/usr/bin/perl" "$SNAP/usr/bin/verilator" "$@"\n' > "$B/verilator"
      chmod 755 "$B"/*
      # With VERILATOR_ROOT set, the verilator script only looks for its backend in
      # $VERILATOR_ROOT/bin (never PATH), but Ubuntu installs verilator_bin to /usr/bin.
      ln -sfn ../../../bin/verilator_bin "$CRAFT_PART_INSTALL/usr/share/verilator/bin/verilator_bin"
    override-prime: |
      craftctl default
      # Snapcraft does not stage packages that core24 already provides (libc6, libstdc++6,
      # libgcc-s1, ...), so linking against $SNAP as sysroot would miss their .so files.
      # Point those at the base snap's copies with absolute symlinks, which resolve to
      # core24's /usr at runtime.
      cd "$CRAFT_PRIME"
      T="${CRAFT_ARCH_TRIPLET_BUILD_FOR}"
      # 1. Absolute paths in linker scripts, e.g. libc.so: GROUP ( /lib/<triplet>/libc.so.6 ... )
      for s in usr/lib/"$T"/*.so usr/lib/gcc/"$T"/*/*.so; do
        [ -f "$s" ] && [ ! -L "$s" ] || continue
        grep -q '^GROUP' "$s" 2>/dev/null || continue
        for p in $(grep '^GROUP' "$s" | grep -o '/[^ )]*'); do
          if [ ! -e ".$p" ] && [ -e "$p" ]; then
            mkdir -p "$(dirname ".$p")"
            ln -sfn "$p" ".$p"
          fi
        done
        # Bare names are searched in the library path, e.g. libgcc_s.so: GROUP ( libgcc_s.so.1 -lgcc )
        for n in $(grep '^GROUP' "$s" | tr ' ()' '\n\n\n' | grep -x '[^/-][^/]*\.so[.0-9]*'); do
          if [ ! -e "usr/lib/$T/$n" ] && [ ! -e "$(dirname "$s")/$n" ] && [ -e "/usr/lib/$T/$n" ]; then
            ln -sfn "/usr/lib/$T/$n" "usr/lib/$T/$n"
          fi
        done
      done
      # 2. Dangling .so symlinks, e.g. gcc/<triplet>/13/libstdc++.so -> ../../../<triplet>/libstdc++.so.6
      find usr/lib -type l -name '*.so*' | while read -r l; do
        [ -e "$l" ] && continue
        t="$(realpath -m "$l")"
        rel="/${t#"$CRAFT_PRIME"/}"
        if [ -e "$rel" ]; then ln -sfn "$rel" "$l"; fi
      done
